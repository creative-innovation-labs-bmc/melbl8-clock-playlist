<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-src https://creative-innovation-labs-bmc.github.io; child-src https://creative-innovation-labs-bmc.github.io; connect-src 'self'; font-src 'self'; media-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors *; upgrade-insecure-requests">
  <title>Melbourne Clock Playlist</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="player" class="player" aria-live="polite">
    <iframe id="frame-a" class="clock-frame is-active" title="Clock display" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
    <iframe id="frame-b" class="clock-frame" title="Next clock display" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>

    <section id="status-card" class="status-card">
      <p>Clock playlist</p>
      <h1 id="status-title">Starting…</h1>
      <p id="status-detail">Loading the published playlist.</p>
    </section>
  </main>

  <script src="playlist-core.js"></script>
  <script src="app.js"></script>
</body>
</html>
