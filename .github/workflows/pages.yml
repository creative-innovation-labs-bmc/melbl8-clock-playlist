name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run source tests
        run: npm test

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Check live player
        id: smoke
        continue-on-error: true
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-all-errors --max-time 30 \
            "$PAGE_URL" -o /tmp/live-index.html
          grep -F '<title>Melbourne Clock Playlist</title>' /tmp/live-index.html

          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-all-errors --max-time 30 \
            "${PAGE_URL%/}/config.js" -o /tmp/live-config.js
          grep -F 'CLOCK_PLAYLIST_DEFAULTS' /tmp/live-config.js

      - name: Publish live smoke status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          if [ "$SMOKE_OUTCOME" = "success" ]; then
            state="success"
            description="Live player and configuration loaded"
          else
            state="failure"
            description="Live GitHub Pages smoke check failed"
          fi

          payload=$(python3 - <<PY
          import json
          import os
          print(json.dumps({
              "state": os.environ["state"],
              "context": "pages/live-smoke",
              "description": os.environ["description"],
              "target_url": os.environ["PAGE_URL"],
          }))
          PY
          )

          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data "$payload"

          test "$state" = "success"
