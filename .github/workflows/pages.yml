name: Validate and deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and published playlist
        run: npm test

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Check live player, JSON, editor and every clock URL
        id: smoke
        continue-on-error: true
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-all-errors --max-time 30 \
            "$PAGE_URL" -o /tmp/live-index.html
          grep -F '<title>Melbourne Clock Playlist</title>' /tmp/live-index.html
          ! grep -F 'admin-hud' /tmp/live-index.html
          ! grep -F 'manager' /tmp/live-index.html

          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-all-errors --max-time 30 \
            "${PAGE_URL%/}/playlist.json" -o /tmp/live-playlist.json
          node -e "const p=require('/tmp/live-playlist.json'); if(!Array.isArray(p.clocks)||!p.clocks.some(c=>c.enabled)) process.exit(1)"

          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-all-errors --max-time 30 \
            "${PAGE_URL%/}/editor.html" -o /tmp/live-editor.html
          grep -F '<title>Clock Playlist JSON Editor</title>' /tmp/live-editor.html

          node - <<'NODE' > /tmp/clock-urls.tsv
          const p = require('/tmp/live-playlist.json');
          for (const c of p.clocks.filter(c => c.enabled)) {
            process.stdout.write(`${c.name.replace(/\t|\n/g, ' ')}\t${c.url}\n`);
          }
          NODE

          while IFS=$'\t' read -r clock_name clock_url; do
            echo "Checking: $clock_name"
            headers=$(mktemp)
            body=$(mktemp)
            curl --fail --silent --show-error --location \
              --retry 4 --retry-delay 3 --retry-all-errors --max-time 30 \
              --dump-header "$headers" --output "$body" "$clock_url"

            test -s "$body"

            if grep -Eiq '^x-frame-options:[[:space:]]*DENY([[:space:]]|$)' "$headers"; then
              echo "Clock blocks iframe embedding with X-Frame-Options: DENY: $clock_url" >&2
              exit 1
            fi

            if grep -Eiq "^content-security-policy:.*frame-ancestors[[:space:]]+'none'" "$headers"; then
              echo "Clock blocks iframe embedding with frame-ancestors none: $clock_url" >&2
              exit 1
            fi

            rm -f "$headers" "$body"
          done < /tmp/clock-urls.tsv

      - name: Publish live smoke status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          if [ "$SMOKE_OUTCOME" = "success" ]; then
            state="success"
            description="Player, editor and all clock URLs loaded"
          else
            state="failure"
            description="Live player or clock URL smoke check failed"
          fi

          export state description

          payload=$(python3 - <<'PY'
          import json
          import os
          print(json.dumps({
              "state": os.environ["state"],
              "context": "pages/live-smoke",
              "description": os.environ["description"],
              "target_url": os.environ["PAGE_URL"],
          }))
          PY
          )

          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data "$payload"

          test "$state" = "success"
